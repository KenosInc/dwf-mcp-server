[project]
name = "dwf-mcp-server"
version = "0.2.1"
description = "MCP server for Digilent WaveForms instruments (oscilloscope, AWG, logic analyzer)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # fastmcp 3.4.10+ fixes GHSA-7xgj-8392-5q4r; 4.x moved fastmcp.tools.tool and
    # needs a separate migration, so stay on the 3.x line for now.
    "fastmcp>=3.4.10,<4",
    "dwfpy>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.scripts]
dwf-mcp-server = "dwf_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dwf_mcp_server"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "PLC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
